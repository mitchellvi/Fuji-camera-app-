<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171714"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fuji Pocket"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Fuji Pocket Camera</title>
<style>
:root{color-scheme:dark;--bg:#171714;--panel:#24241f;--muted:#aaa99e;--cream:#eee9dc;--accent:#d6a45e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh}.app{max-width:650px;margin:auto;padding:env(safe-area-inset-top) 18px calc(22px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}.brand{font-size:19px;font-weight:750;letter-spacing:.04em}.brand span{color:var(--accent)}.status{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.view{position:relative;overflow:hidden;border-radius:20px;background:#090909;aspect-ratio:3/4;max-height:65svh;display:grid;place-items:center;box-shadow:0 16px 45px #0008}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{display:none}.placeholder{position:absolute;text-align:center;color:#d4d0c6;padding:24px;max-width:280px}.placeholder p{color:#9e9b91;font-size:14px;line-height:1.5}.overlay{position:absolute;inset:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.tag{font-size:10px;letter-spacing:.14em;border:1px solid #ffffff55;border-radius:30px;padding:7px 10px;background:#0005}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.on{animation:flash .22s}@keyframes flash{0%{opacity:.85}100%{opacity:0}}h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:22px 2px 11px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.preset{border:1px solid #4b4a40;background:var(--panel);color:var(--cream);border-radius:13px;padding:12px 8px;text-align:left;min-height:68px}.preset.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.preset b{display:block;font-size:13px;margin-bottom:4px}.preset small{color:var(--muted);font-size:10px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 4px 0}.round{width:48px;height:48px;border-radius:50%;border:1px solid #77766b;background:#282821;color:var(--cream);font-size:19px}.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #e8e1d1;background:var(--accent);box-shadow:0 0 0 3px #171714,0 0 0 4px #77766b}.shutter:active{transform:scale(.96)}.actions{display:flex;gap:10px;margin-top:18px}.action{flex:1;border:1px solid #4b4a40;background:#25251f;color:var(--cream);padding:13px;border-radius:12px;font-weight:600;font-size:13px}.action.primary{background:var(--cream);color:#1c1b17;border-color:var(--cream)}.note{text-align:center;color:#89877d;font-size:11px;line-height:1.5;margin:18px 10px 4px}button{cursor:pointer;font:inherit}button:disabled{opacity:.45;cursor:default}@media(min-width:600px){.app{padding-top:18px}.view{max-height:600px}}
</style></head><body><div class="app"><header><div class="brand">FUJI <span>POCKET</span></div><div class="status">DIGITAL FILM CAMERA</div></header><main><div class="view" id="view"><video id="video" autoplay playsinline muted></video><div class="placeholder" id="placeholder"><div style="font-size:34px">◎</div><b>Jouw pocket camera</b><p>Geef toegang tot je camera om te beginnen met fotograferen.</p><button class="action primary" id="start">Camera starten</button></div><div class="overlay"><span class="tag">FP · 01</span><span class="tag" id="filmLabel">CLASSIC CHROME</span></div><div class="flash" id="flash"></div></div><h2>Kies je filmsimulatie</h2><div class="presets"><button class="preset active" data-preset="chrome"><b>Classic Chrome</b><small>Muted · documentary</small></button><button class="preset" data-preset="neg"><b>Classic Neg.</b><small>Deep · punchy</small></button><button class="preset" data-preset="gold"><b>Kodak Gold 200</b><small>Warm · nostalgic</small></button></div><div class="controls"><button class="round" id="flip" aria-label="Wissel camera">↻</button><button class="shutter" id="shoot" aria-label="Maak foto" disabled></button><button class="round" id="grid" aria-label="Raster">▦</button></div><div class="actions"><button class="action" id="reset">Opnieuw</button><button class="action primary" id="save" disabled>Bewaar foto</button></div><p class="note">Digitale interpretaties, geen officiële Fujifilm- of Kodak-profielen. Foto's worden lokaal op je toestel verwerkt.</p><canvas id="canvas"></canvas></main></div>
<script>
const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),placeholder=document.querySelector('#placeholder'),shoot=document.querySelector('#shoot'),save=document.querySelector('#save'),filmLabel=document.querySelector('#filmLabel'),flash=document.querySelector('#flash');let stream=null,facing='environment',preset='chrome',lastPhoto=null,showGrid=false;
const looks={chrome:{label:'CLASSIC CHROME',filter:'contrast(1.12) saturate(.72) sepia(.10) brightness(.98)',warm:.035,grain:13},neg:{label:'CLASSIC NEG.',filter:'contrast(1.24) saturate(1.08) sepia(.08) brightness(.97)',warm:.025,grain:17},gold:{label:'KODAK GOLD 200',filter:'contrast(1.08) saturate(1.18) sepia(.22) brightness(1.03)',warm:.10,grain:19}};
function setPreset(p){preset=p;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',b.dataset.preset===p));filmLabel.textContent=looks[p].label;video.style.filter=looks[p].filter}document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.preset)));
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('secure');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1920},height:{ideal:2560}}});video.srcObject=stream;await video.play();placeholder.style.display='none';shoot.disabled=false}catch(e){placeholder.style.display='block';placeholder.querySelector('p').textContent='Cameratoegang niet beschikbaar. Open de HTTPS-link in Safari en sta cameratoegang toe.'}}
document.querySelector('#start').addEventListener('click',startCamera);document.querySelector('#flip').addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';startCamera()});document.querySelector('#grid').addEventListener('click',()=>{showGrid=!showGrid;document.querySelector('#view').style.backgroundImage=showGrid?'linear-gradient(transparent 49.7%,#ffffff66 50%,transparent 50.3%),linear-gradient(90deg,transparent 49.7%,#ffffff66 50%,transparent 50.3%)':'none';document.querySelector('#view').style.backgroundSize='100% 100%'});
function grain(w,h,amount){const noise=document.createElement('canvas');noise.width=Math.max(1,Math.floor(w/3));noise.height=Math.max(1,Math.floor(h/3));const nctx=noise.getContext('2d'),img=nctx.createImageData(noise.width,noise.height);for(let i=0;i<img.data.length;i+=4){let v=128+(Math.random()-.5)*amount*5;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=Math.random()*amount*1.8}nctx.putImageData(img,0,0);ctx.save();ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=.2;ctx.drawImage(noise,0,0,w,h);ctx.restore()}
document.querySelector('#shoot').addEventListener('click',()=>{if(!stream)return;const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;canvas.width=w;canvas.height=h;ctx.save();ctx.filter=looks[preset].filter;if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,w,h);ctx.restore();ctx.filter='none';const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,194,120,'+looks[preset].warm+')');g.addColorStop(1,'rgba(90,45,20,'+(looks[preset].warm*.35)+')');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);grain(w,h,looks[preset].grain);lastPhoto=canvas.toDataURL('image/jpeg',.94);save.disabled=false;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')});
document.querySelector('#save').addEventListener('click',async()=>{if(!lastPhoto)return;const blob=await(await fetch(lastPhoto)).blob(),file=new File([blob],'fuji-pocket-'+Date.now()+'.jpg',{type:'image/jpeg'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Fuji Pocket foto'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=lastPhoto;a.download=file.name;a.click()});document.querySelector('#reset').addEventListener('click',()=>{lastPhoto=null;save.disabled=true;setPreset('chrome')});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));setPreset('chrome');
</script></body></html>
